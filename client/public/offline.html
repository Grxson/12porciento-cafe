<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf7f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0806" />
    <title>Sin conexión — 12% Café</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem max(env(safe-area-inset-right, 0px), 1rem) 2rem max(env(safe-area-inset-left, 0px), 1rem);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #faf7f4;
        color: #2a1c14;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0d0806;
          color: #f5ede4;
        }
      }
      .wrap {
        max-width: 26rem;
      }
      .icon {
        font-size: 2.75rem;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.375rem;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 1.75rem;
        line-height: 1.55;
        opacity: 0.75;
        font-size: 0.95rem;
      }
      button {
        min-height: 44px;
        padding: 0.75rem 2rem;
        border: none;
        background: #c98a3c;
        color: #1a0f08;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        font-size: 0.8rem;
        cursor: pointer;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="icon">☕</div>
      <h1>Sin conexión</h1>
      <p>No pudimos cargar esta página y aún no tenemos nada guardado para verla sin internet. Revisa tu conexión e intenta de nuevo.</p>
      <button onclick="window.location.reload()">Reintentar</button>
    </div>
  </body>
</html>
